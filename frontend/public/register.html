<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PhotoShare — Create Account</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="auth-brand-logo">📸</div>
      <h1 class="auth-brand-name">Photo<span>Share</span></h1>
      <p class="auth-tagline">Join thousands of creators and consumers sharing visual stories every day.</p>
      <div class="auth-dots">
        <div class="auth-dot"></div>
        <div class="auth-dot active"></div>
        <div class="auth-dot"></div>
      </div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2>Create account</h2>
      <p class="auth-sub">Join PhotoShare — it's free</p>

      <div id="alert" class="alert alert-error" style="display:none">
        <span class="alert-icon">⚠</span>
        <span id="alert-msg"></span>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="display_name">Display Name</label>
          <input class="form-control" type="text" id="display_name" placeholder="Jane Doe" required/>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" type="text" id="username" placeholder="jane_doe" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" placeholder="jane@example.com" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" required/>
        </div>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:.35rem" id="register-btn">Create Account</button>
      </form>

      <p class="auth-footer-text">Already have an account? <a href="/index.html">Sign in</a></p>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  redirectIfLoggedIn();
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const alertBox = document.getElementById('alert');
    const alertMsg = document.getElementById('alert-msg');
    const btn = document.getElementById('register-btn');
    alertBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      await authHelpers.register(
        document.getElementById('username').value.trim(),
        document.getElementById('email').value.trim(),
        document.getElementById('password').value,
        document.getElementById('display_name').value.trim()
      );
      window.location.href = '/consumer.html';
    } catch(err) {
      alertMsg.textContent = err.message || 'Registration failed.';
      alertBox.style.display = 'flex';
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
