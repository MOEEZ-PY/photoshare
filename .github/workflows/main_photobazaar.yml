name: Build and deploy Docker app to Azure Web App - PhotoBazaar

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFDF828E90494A26A554E7E5515FB5B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A439C536434B43B19D94C081F3A9A6B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0382F676C4C2428995A162493545AB8E }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-backend:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-backend:latest \
            ./backend
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-backend:${{ github.sha }}
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-backend:latest

      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-frontend:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-frontend:latest \
            ./frontend
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-frontend:${{ github.sha }}
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFDF828E90494A26A554E7E5515FB5B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A439C536434B43B19D94C081F3A9A6B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0382F676C4C2428995A162493545AB8E }}

      - name: Generate deployment compose from template
        env:
          ACR_REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: envsubst < docker-compose.azure.yml > docker-compose.deploy.yml

      - name: Deploy multi-container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PhotoBazaar'
          slot-name: 'Production'
          configuration-file: docker-compose.deploy.yml
