name: Build and deploy Docker app to Azure Web App - PhotoBazaar

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-backend:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-backend:latest \
            ./backend
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-backend:${{ github.sha }}
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-backend:latest

      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-frontend:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/photobazaar-frontend:latest \
            ./frontend
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-frontend:${{ github.sha }}
          docker push ${{ env.ACR_REGISTRY }}/photobazaar-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate deployment compose from template
        env:
          ACR_REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: envsubst < docker-compose.azure.yml > docker-compose.deploy.yml

      - name: Deploy multi-container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PhotoBazaar'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          configuration-file: docker-compose.deploy.yml
